<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>¿Blanca o roja? · Punta Norte</title><meta name="description" content="Vota qué guitarra llevo al concierto de Punta Norte en la Romaría da Cortiña."><meta property="og:title" content="🎸 ¿Blanca o roja? · Punta Norte"><meta property="og:description" content="Elige qué guitarra llevo al concierto: blanca o roja."><meta property="og:image" content="https://raw.githubusercontent.com/glorenzoglp-cell/caminos-cl-nicos/main/guitar-vote/poster.jpg"><style>*{box-sizing:border-box}body{margin:0;background:#0d0d0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:flex;justify-content:center}main{width:min(720px,100%);padding:10px}.card{background:#19191c;border:1px solid #333;border-radius:22px;overflow:hidden}.poster,.hero{width:100%;display:block}.poster{max-height:340px;object-fit:contain;background:#eee}.hero{max-height:460px;object-fit:cover;object-position:center 58%}.event,.content{padding:18px}.event{border-top:1px solid #333}h1{font-size:26px;margin:0 0 7px}p{color:#c8c8cf;margin:0}.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.opt{position:relative}.opt input{position:absolute;opacity:0}.opt label{min-height:74px;border-radius:16px;border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;cursor:pointer;position:relative}.w label{background:#f4f0df;color:#111}.r label{background:#b73333}.opt input:checked+label{border-color:#ffd166;box-shadow:0 0 0 4px rgba(255,209,102,.25)}.opt input:checked+label:after{content:"✓";position:absolute;right:12px;top:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ffd166;color:#111}button{width:100%;min-height:54px;margin-top:16px;border:0;border-radius:15px;background:#ffd166;color:#111;font-size:18px;font-weight:900}button:disabled{opacity:.45}.small{text-align:center;color:#999;font-size:12px;margin-top:12px}#msg{text-align:center;font-weight:800;min-height:26px;margin-top:12px}@media(max-width:520px){.opts{grid-template-columns:1fr}}</style></head><body><main><div class="card"><img class="poster" src="https://raw.githubusercontent.com/glorenzoglp-cell/caminos-cl-nicos/main/guitar-vote/poster.jpg" alt="Cartel del concierto"><div class="event"><h1>🎸 ¿Cuál llevo a Punta Norte?</h1><p>30 agosto · 19:15 h · Romaría da Cortiña 2026 · San Sadurniño</p></div><img class="hero" src="https://raw.githubusercontent.com/glorenzoglp-cell/caminos-cl-nicos/main/guitar-vote/guitarras.jpg" alt="Guitarra blanca y guitarra roja"><div class="content"><form id="f"><div class="opts"><div class="opt w"><input id="w" type="radio" name="voto" value="BLANCA" required><label for="w">🤍 BLANCA</label></div><div class="opt r"><input id="r" type="radio" name="voto" value="ROJA" required><label for="r">❤️ ROJA</label></div></div><button id="send" type="submit" disabled>Enviar mi voto</button></form><div id="msg" aria-live="polite"></div><div class="small">Voto anónimo: no se solicita nombre, teléfono ni correo.</div></div></div></main><script>(()=>{const rs=[...document.querySelectorAll('input[name=voto]')],b=document.getElementById('send'),m=document.getElementById('msg'),f=document.getElementById('f');let v='';rs.forEach(r=>r.addEventListener('change',()=>{v=r.value;b.disabled=false;m.textContent='Seleccionada: '+v+' ✓'}));f.addEventListener('submit',async e=>{e.preventDefault();if(!v)return;b.disabled=true;m.textContent='Registrando voto…';try{const q=await fetch('/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vote:v})});const d=await q.json();if(!q.ok||!d.ok)throw new Error();m.textContent='¡Voto registrado! Gracias 🎸';rs.forEach(x=>x.disabled=true)}catch(e){b.disabled=false;m.textContent='No se pudo registrar. Inténtalo de nuevo.'}})})();</script></body></html>
